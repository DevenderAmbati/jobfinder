name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (validate · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: jobfinder
          POSTGRES_DB: jobfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobfinder:jobfinder@localhost:5432/jobfinder?schema=public
      NODE_ENV: test
      ENABLE_DEV_TOOLS: 'true'
      GEMINI_ENABLED: 'false'
      LOG_TO_FILES: 'false'
      PLAYWRIGHT_HEADLESS: 'true'
      PLAYWRIGHT_MAX_CONCURRENT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: TypeScript compile
        run: npm run typecheck
      - name: Unit / integration tests
        run: npm test
      - name: Build server
        run: npm run build:server

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  single-process-build:
    name: Single-process build (UI → backend/public + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install backend
        run: npm ci
        working-directory: backend
        env:
          # postinstall prisma generate needs a URL shape; migrate not required for compile
          DATABASE_URL: postgresql://jobfinder:jobfinder@127.0.0.1:5432/jobfinder?schema=public
      - name: Production build
        run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://jobfinder:jobfinder@127.0.0.1:5432/jobfinder?schema=public
      - name: Assert UI bundle present
        run: test -f backend/public/index.html
