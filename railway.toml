[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Preferred deploy target is Cloud Run — see docs/FIREBASE.md
# Start is defined by Dockerfile CMD: node dist/server.js
